# Native host nginx for mneme.narusec.io — the public entry point.
# Terminates TLS, serves the static SPA, and reverse-proxies /api/ to the
# Dockerized backend on 127.0.0.1:5100 (plain HTTP). See docs/deployment.md.
#
# Install on the VM:
#   sudo cp /home/notes-assistant/deploy/nginx/mneme.narusec.io.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/mneme.narusec.io.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mneme.narusec.io;

    # Let certbot answer ACME http-01 challenges; redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mneme.narusec.io;

    ssl_certificate     /etc/letsencrypt/live/mneme.narusec.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mneme.narusec.io/privkey.pem;

    # Static SPA build (rsynced here by deploy.ts).
    root /home/notes-assistant/gui;
    index index.html;

    # Uploads: the backend accepts up to 100mb (audio). nginx defaults to 1m.
    client_max_body_size 100m;

    # API → Dockerized backend. Streaming-friendly: the AI chat streams a UI message
    # stream, so disable buffering to flush tokens as they arrive (else they batch up).
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
