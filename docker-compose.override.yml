# DEV overrides — auto-applied by `docker compose up` (no -f needed).
# Backend + frontend hot-reload; source is bind-mounted; the anonymous
# node_modules volumes keep the container's (Linux) deps instead of the host's.
#
# WATCH_POLLING (default true): poll for file changes instead of relying on
# native OS events. Required when the repo lives on a Windows/macOS drive that's
# bind-mounted into the Linux containers — inotify events don't cross that
# boundary, so `bun --watch` / Vite HMR would silently miss your edits. Set
# WATCH_POLLING=false (in .env) if you run from the WSL2/Linux filesystem, where
# native events work and polling just wastes CPU.
services:
  # Bind-mount the shared workspace so newly generated migrations (shared/drizzle)
  # apply on the next `up` without rebuilding the migrate image. Anonymous volumes
  # keep the image's (Linux) node_modules — that's where drizzle-kit lives.
  migrate:
    volumes:
      - ./shared:/app/shared
      - /app/node_modules
      - /app/shared/node_modules

  # Same idea for the Qdrant collection-ensure one-shot: bind-mount the backend
  # source so script edits apply without rebuilding the image.
  qdrant-init:
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
      - /app/backend/node_modules

  backend:
    build:
      target: dev
    environment:
      MODE: dev
      NODE_ENV: development
      WATCH_POLLING: ${WATCH_POLLING:-true}
    # Polling → nodemon (bun --watch has no polling mode); native → bun --watch.
    command:
      - sh
      - -c
      - 'if [ "$$WATCH_POLLING" = "true" ]; then exec bun run dev:poll; else exec bun run dev; fi'
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules

  frontend:
    build:
      target: dev
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_DEV_URL: ${VITE_API_DEV_URL:-http://localhost:5100/api/}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      WATCH_POLLING: ${WATCH_POLLING:-true}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
