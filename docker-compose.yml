# Full stack: data services + backend API + frontend.
#
#   DEV   (default):  docker compose up                  (or: bun run dev)
#         → backend + frontend hot-reload (plain HTTP); docker-compose.override.yml
#           is auto-applied. Source is bind-mounted, so code edits need NO rebuild.
#         → one-shot init services run before the backend starts: `migrate` (DB
#           migrations, once Postgres is healthy) and `qdrant-init` (ensures Qdrant
#           collections exist). Both are idempotent — see those services below.
#         → after changing deps (package.json/bun.lock) or a Dockerfile, run
#           `bun run dev:rebuild` (docker compose up --build --renew-anon-volumes):
#           --build alone won't surface new deps because the anonymous
#           node_modules volumes from the old container shadow the fresh image.
#
#   PROD:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#         → backend runs the bundle (HTTPS, certs from /etc/letsencrypt),
#           frontend is a static build served by nginx.   (or: bun run prod)
#
# Quick start:
#   1. cp backend/.env.example backend/.env     (fill in API keys / auth secrets)
#   2. cp .env.example .env                      (set VITE_CLERK_PUBLISHABLE_KEY, …)
#   3. bun run dev
#
# Port mappings (host -> container), bound to localhost only:
#   Frontend (dev/Vite): 5173 -> 5173     Frontend (prod/nginx): 8081 -> 80
#   Backend:    5100  -> 5100
#   Qdrant:     6971  -> 6333
#   Redis:      6380  -> 6379
#   Postgres:   5433  -> 5432
#   MongoDB:    27018 -> 27017
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-assistant-backend
    # API keys etc. live here. Marked optional so the stack still starts on a
    # fresh clone where backend/.env doesn't exist yet.
    env_file:
      - path: backend/.env
        required: false
    # DB connection targets point at the internal service hostnames and
    # override anything in .env (which targets localhost for host-run dev).
    environment:
      MODE: dev
      APP_PORT: 5100
      POSTGRES_URI: postgres://postgres:example@postgres-ai-assistant:5432/postgres
      MONGODB_URI: mongodb://root:example@mongo-ai-assistant:27017/notes-db?authSource=admin
      REDIS_URL: redis://redis-ai-assistant:6379
      QDRANT_HOST: qdrant-ai-assistant
      QDRANT_PORT: 6333
    ports:
      - "127.0.0.1:5100:5100"
    depends_on:
      # Wait for migrations to finish before the API starts, so a fresh Postgres
      # volume has its tables before the first request hits verifyJWT (which reads
      # the `profile` table). `migrate` itself waits on postgres being healthy.
      migrate:
        condition: service_completed_successfully
      # Ensures the Qdrant collections exist (notes, …) before the API serves, so
      # store-note doesn't 500 on a fresh volume. qdrant-init itself waits on Qdrant.
      qdrant-init:
        condition: service_completed_successfully
      redis-ai-assistant:
        condition: service_started
      # Chat persistence connects to Mongo at worker startup, so wait until mongod
      # actually accepts connections — `condition: service_started` alone races the
      # mongod boot and the connect fails with ECONNREFUSED on a cold `up`.
      mongo-ai-assistant:
        condition: service_healthy

  # One-shot: applies the shared/drizzle migrations, then exits. The backend
  # gates on this completing (service_completed_successfully), so tables always
  # exist before the API serves. Idempotent — re-running only applies pending
  # migrations. (Prod-on-VM still migrates via deploy.ts; this covers the
  # docker-compose dev + local-prod paths.)
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    container_name: ai-assistant-migrate
    restart: "no"
    environment:
      POSTGRES_URI: postgres://postgres:example@postgres-ai-assistant:5432/postgres
    depends_on:
      postgres-ai-assistant:
        condition: service_healthy

  # One-shot: ensures the Qdrant collections (notes, …) exist, then exits. The
  # backend gates on this completing, so store-note doesn't 500 on a fresh Qdrant
  # volume. Idempotent — create-on-404. (The destructive polites reset is
  # qdrant-init.ts's own main(), run by hand only.)
  qdrant-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: qdrant-init
    container_name: ai-assistant-qdrant-init
    restart: "no"
    environment:
      QDRANT_HOST: qdrant-ai-assistant
      QDRANT_PORT: 6333
    depends_on:
      qdrant-ai-assistant:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-assistant-frontend
    depends_on:
      - backend

  qdrant-ai-assistant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: ai-assistant-qdrant
    ports:
      - "127.0.0.1:6971:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
      - ./qdrant_config.yaml:/qdrant/config/config.yaml

  redis-ai-assistant:
    image: redis:latest
    restart: always
    container_name: ai-assistant-redis
    ports:
      - "127.0.0.1:6380:6379"

  postgres-ai-assistant:
    image: postgres:17
    restart: always
    container_name: ai-assistant-postgres
    shm_size: 1024mb
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    # The `migrate` service (and backend) wait on this, so a cold `up` doesn't
    # race the postgres boot — pg_isready confirms the server accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-ai-assistant:
    image: mongo:7
    restart: always
    container_name: ai-assistant-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ./data/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      # start_period probes fast during boot without counting failures, so the
      # backend's `condition: service_healthy` wait still resolves quickly on a
      # cold `up`. interval only governs steady-state polling — keep it long so
      # mongod isn't churning connect/disconnect (and log spam) every few seconds.
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
