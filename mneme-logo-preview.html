<!doctype html>
<!--
  SCRATCH FILE — thickness/size dial for the mneme Archivo Black wordmark. Not imported
  anywhere; safe to delete. Open directly in a browser.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mneme — bigger & thicker?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --font-sans: 'Inter', system-ui, sans-serif;
        --background: oklch(0.9647 0.0118 84.59);
        --foreground: oklch(0.32 0.025 264);
        --primary: oklch(0.38 0.095 256);
        --highlight: oklch(0.9 0.16 95);
        --muted-foreground: oklch(0.5 0.022 264);
        --grain: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='140'%3E%3Cfilter%20id='n'%20color-interpolation-filters='sRGB'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.5'%20numOctaves='3'%20seed='0'%20stitchTiles='stitch'/%3E%3CfeDiffuseLighting%20surfaceScale='1.5'%20diffuseConstant='1'%20lighting-color='%23fff'%3E%3CfeDistantLight%20azimuth='45'%20elevation='55'/%3E%3C/feDiffuseLighting%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncR%20type='linear'%20slope='0.5'%20intercept='0.5604'/%3E%3CfeFuncG%20type='linear'%20slope='0.5'%20intercept='0.5604'/%3E%3CfeFuncB%20type='linear'%20slope='0.5'%20intercept='0.5604'/%3E%3CfeFuncA%20type='linear'%20slope='0'%20intercept='1'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; font-family: var(--font-sans); color: var(--foreground);
        background-color: var(--background); background-image: var(--grain); background-size: 150px; background-blend-mode: multiply;
      }
      header { padding: 1.6rem 2rem 0.4rem; }
      header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
      header p { margin: .25rem 0 0; font-size: .85rem; color: var(--muted-foreground); }
      .rows { display: flex; flex-direction: column; gap: .5rem; padding: 1rem 1rem 3rem; max-width: 760px; margin: 0 auto; }
      .row {
        display: flex; align-items: center; gap: 1.4rem; padding: 1.4rem;
        border-radius: .7rem; border: 1px solid color-mix(in srgb, var(--foreground) 12%, transparent);
        background: color-mix(in srgb, var(--background) 70%, #fff);
      }
      .row .caption { margin-left: auto; text-align: right; line-height: 1.3; }
      .row .caption b { display: block; font-size: .82rem; }
      .row .caption span { font-size: .72rem; color: var(--muted-foreground); }

      .nb-logo { display: inline-flex; align-items: center; gap: 16px; line-height: 1; }
      .nb-logo-mark { flex: none; overflow: visible; }
      .nb-logo-seal { fill: var(--primary); }
      .nb-logo-word { position: relative; display: inline-block; font-family: 'Archivo Black', sans-serif; text-transform: uppercase; color: var(--foreground); }
      .nb-logo-ink { position: relative; z-index: 1; display: inline-block; }
      .nb-logo-swipe {
        position: absolute; z-index: 0; left: -.02em; right: .04em; bottom: .06em; height: .42em;
        border-radius: .4em .5em .45em .55em / .5em; background: color-mix(in srgb, var(--highlight) 48%, transparent);
        transform: rotate(-1deg); transform-origin: left center;
      }

      /* the dial */
      .lv-current  .nb-logo-word { font-size: 2.3rem; letter-spacing: .028em; }
      .lv-proposed .nb-logo-word { font-size: 2.7rem; letter-spacing: .012em; }
      .lv-proposed .nb-logo-ink  { -webkit-text-stroke: .015em currentColor; }
      .lv-thicker  .nb-logo-word { font-size: 2.7rem; letter-spacing: .012em; }
      .lv-thicker  .nb-logo-ink  { -webkit-text-stroke: .03em currentColor; }
    </style>
  </head>
  <body>
    <header>
      <h1>mneme — how thick / big?</h1>
      <p>same seal + word, three levels. the middle one is what's wired into the app right now.</p>
    </header>
    <div class="rows">
      <div class="row lv-current"  data-seal="60" data-name="current"  data-vibe="2.3rem · normal stroke"></div>
      <div class="row lv-proposed" data-seal="68" data-name="proposed (now live)" data-vibe="2.7rem · tighter · +0.015em stroke"></div>
      <div class="row lv-thicker"  data-seal="68" data-name="even thicker" data-vibe="2.7rem · +0.03em stroke"></div>
    </div>
    <script>
      const COIL =
        'M 23.42 8.58 L 24.16 9.49 L 24.77 10.48 L 25.28 11.53 L 25.65 12.61 L 25.91 13.73 L 26.03 14.86 L 26.03 15.99 L 25.90 17.10 L 25.65 18.19 L 25.28 19.23 L 24.80 20.22 L 24.22 21.14 L 23.54 21.98 L 22.77 22.74 L 21.94 23.40 L 21.03 23.96 L 20.08 24.42 L 19.09 24.76 L 18.08 24.98 L 17.06 25.09 L 16.03 25.08 L 15.02 24.96 L 14.04 24.73 L 13.10 24.40 L 12.21 23.96 L 11.38 23.43 L 10.62 22.81 L 9.94 22.12 L 9.35 21.36 L 8.85 20.55 L 8.44 19.69 L 8.14 18.80 L 7.94 17.89 L 7.85 16.97 L 7.86 16.05 L 7.97 15.15 L 8.18 14.27 L 8.49 13.43 L 8.89 12.63 L 9.36 11.89 L 9.92 11.22 L 10.54 10.62 L 11.22 10.09 L 11.94 9.65 L 12.71 9.30 L 13.50 9.04 L 14.31 8.87 L 15.13 8.79 L 15.94 8.80 L 16.74 8.91 L 17.51 9.10 L 18.25 9.38 L 18.95 9.73 L 19.59 10.16 L 20.18 10.65 L 20.71 11.20 L 21.16 11.80 L 21.54 12.44 L 21.85 13.11 L 22.07 13.81 L 22.21 14.51 L 22.27 15.22 L 22.25 15.93 L 22.15 16.62 L 21.98 17.29 L 21.73 17.93 L 21.42 18.53 L 21.04 19.09 L 20.61 19.59 L 20.14 20.04 L 19.62 20.42 L 19.06 20.74 L 18.48 20.99 L 17.89 21.18 L 17.28 21.29 L 16.67 21.33 L 16.07 21.31 L 15.48 21.21 L 14.92 21.06 L 14.38 20.84 L 13.88 20.57 L 13.42 20.25 L 13.00 19.88 L 12.63 19.47 L 12.32 19.03 L 12.06 18.56 L 11.86 18.07 L 11.71 17.57 L 11.63 17.07 L 11.61 16.56 L 11.64 16.07 L 11.72 15.59 L 11.86 15.13 L 12.05 14.69 L 12.28 14.29 L 12.56 13.92 L 12.86 13.58 L 13.20 13.30 L 13.57 13.05 L 13.95 12.86 L 14.34 12.71 L 14.74 12.60 L 15.15 12.55 L 15.55 12.54 L 15.94 12.58 L 16.31 12.66 L 16.67 12.79 L 17.01 12.94 L 17.31 13.14 L 17.59 13.36 L 17.83 13.61 L 18.04 13.88 L 18.22 14.16 L 18.35 14.46 L 18.45 14.76 L 18.51 15.07 L 18.53 15.37 L 18.52 15.66 L 18.47 15.95 L 18.40 16.22 L 18.29 16.47 L 18.16 16.70 L 18.01 16.91 L 17.83 17.10 L 17.65 17.25 L 17.45 17.38 L 17.24 17.49 L 17.03 17.56 L 16.82 17.60';
      let uid = 0;
      function seal(size) {
        const id = 'i' + uid++;
        return `<svg class="nb-logo-mark" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <filter id="st-${id}" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
              <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="7" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <mask id="mk-${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
              <circle cx="16" cy="16" r="14" fill="#fff"/>
              <path d="${COIL}" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="round"/>
              <circle cx="16" cy="16" r="1.9" fill="#000"/>
            </mask>
          </defs>
          <g filter="url(#st-${id})"><circle class="nb-logo-seal" cx="16" cy="16" r="14" mask="url(#mk-${id})"/></g>
        </svg>`;
      }
      document.querySelectorAll('.row').forEach(row => {
        row.insertAdjacentHTML('afterbegin',
          `<span class="nb-logo">${seal(+row.dataset.seal)}<span class="nb-logo-word"><span class="nb-logo-swipe"></span><span class="nb-logo-ink">mneme</span></span></span>` +
          `<span class="caption"><b>${row.dataset.name}</b><span>${row.dataset.vibe}</span></span>`);
      });
    </script>
  </body>
</html>
